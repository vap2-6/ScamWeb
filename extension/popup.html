<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScamWeb Autofill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070D19;
      color: #FFFFFF;
      padding: 14px;
      font-size: 12.5px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #01E8BC;
      font-family: monospace;
      font-size: 13px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #01E8BC;
      box-shadow: 0 0 6px #01E8BC;
    }
    .portal-tag {
      font-size: 10px;
      color: #94A3B8;
      background: #0E1626;
      border: 1px solid #1E293B;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .case-card {
      background: #0E1626;
      border: 1px solid #1E293B;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .case-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11.5px;
    }
    .case-label { color: #94A3B8; }
    .case-val { font-family: monospace; color: #FFFFFF; font-weight: 600; }
    .case-val.risk { color: #FF4757; }
    .notice {
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.4;
      margin-bottom: 14px;
      border-left: 2px solid #01E8BC;
      padding-left: 8px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 8px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: #01E8BC;
      color: #060C18;
    }
    .btn-primary:hover { background: #00C8A0; }
    .btn-secondary {
      background: #0E1626;
      border-color: #1E293B;
      color: #FFFFFF;
    }
    .btn-secondary:hover {
      border-color: #01E8BC;
      color: #01E8BC;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <span class="status-dot"></span>
      <span>ScamWeb Autofill</span>
    </div>
    <span class="portal-tag">NCRP / I4C</span>
  </div>

  <div id="caseView">
    <div class="case-card" id="caseCard">
      <div class="case-row">
        <span class="case-label">Active case:</span>
        <span class="case-val" id="caseId">Checking storage...</span>
      </div>
      <div class="case-row">
        <span class="case-label">Category:</span>
        <span class="case-val" id="caseCategory">-</span>
      </div>
      <div class="case-row">
        <span class="case-label">Threat severity:</span>
        <span class="case-val risk" id="caseRisk">-</span>
      </div>
      <div class="case-row">
        <span class="case-label">Payment rails:</span>
        <span class="case-val" id="casePayments">-</span>
      </div>
    </div>
  </div>

  <div class="notice">
    Autofills form fields on <strong>cybercrime.gov.in</strong>. Does NOT click submit. Always review fields before manual filing.
  </div>

  <button class="btn btn-primary" id="openPortalBtn">
    <span>Open cybercrime.gov.in</span>
  </button>
  <button class="btn btn-secondary" id="pastePayloadBtn">
    <span>Paste Clipboard Payload</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
